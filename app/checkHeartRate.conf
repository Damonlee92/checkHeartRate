server {
	server_name checkheartrate.io *.checkheartrate.io;
    	root /srv/http/checkHeartRate/app;
    	index index.php;
    

    access_log /var/log/nginx/checkheartrate-access.log;
    error_log /var/log/nginx/checkheartrate-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    }

    location ~ /\.ht {
        #deny all;
    }

    location ~ \.conf$ {
        deny all;
    }





    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/checkheartrate.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/checkheartrate.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = checkheartrate.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name checkheartrate.io *.checkheartrate.io;
    listen 80;
    return 404; # managed by Certbot


}